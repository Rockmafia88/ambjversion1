NCTIVE® MAC':'DISTINCTIVE®<br>MAC','Balance Silver':'Balance<br>Silver','Natural Wax Jelly':'Natural Wax<br>Jelly','N-DurHance ES Repair':'N-DurHance<br>ES Repair','Salipharm SA 25%':'Salipharm<br>SA 25%','Tea Tree Oil / Helichrysum Oil':'Tea Tree Oil /<br>Helichrysum<br>Oil'};NAMES[day].forEach((name,i)=>{const label=document.createElement('div');label.className='product-name'+(name.length>22?' long':name.length>15?' medium':'');label.innerHTML=lineBreaks[name]||name;holder.append(label);inputs[i].setAttribute('aria-label',name+' secret digit')})}function clear(){inputs.forEach(i=>i.value='');refresh()}el('start').onclick=()=>{show('page-safe');refresh()};el('home').onclick=()=>{show('page-cover');clear()};el('clear').onclick=()=>{clear();message('ล้างรหัสแล้ว')};el('day').onchange=e=>{day=e.target.value;closeKey();clear();renderNames();refresh();message(`กำลังเล่น DAY ${day}`)};el('digits').addEventListener('click',e=>{if(e.target===el('digits')){const r=el('digits').getBoundingClientRect(); const k=Math.max(0,Math.min(5,Math.floor((e.clientX-r.left)/r.width*6)));inputs[k].click()}});const keys=el('keys');for(const v of ['1','2','3','4','5','6','7','8','9','ลบ','0','ถัดไป']){let btn=document.createElement('button');btn.type='button';btn.textContent=v;btn.onclick=()=>{if(v==='ลบ'){inputs[current].value='';el('key-value').textContent='–';refresh()}else if(v==='ถัดไป'){if(current<5){current++;renderKey()}else closeKey()}else{inputs[current].value=v;el('key-value').textContent=v;refresh();setTimeout(()=>{if(current<5){current++;renderKey()}else closeKey()},120)}};keys.append(btn)}function renderKey(){el('key-title').textContent=NAMES[day][current];el('key-value').textContent=inputs[current].value||'–'}function openKey(i){current=i;renderKey();el('modal').classList.add('open')}function closeKey(){el('modal').classList.remove('open')}inputs.forEach((inp,i)=>inp.addEventListener('click',()=>openKey(i)));el('key-close').onclick=closeKey;el('modal').addEventListener('click
