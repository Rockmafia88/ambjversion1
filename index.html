(()=>{const MAX=20,PINS={'1':'729406','2':'381590','3':'618372'},DAY_NAMES={'1':['AIM ex Peach','Glutaluxe','Natural Clays','Skincharge CLR','Organic Alpine','MiyoFeel'],'2':['Liftalize','KHG-3818','Silky Mica CS','DISTINCTIVE® MAC','Balance Silver','Natural Wax Jelly'],'3':['BioAPATITE','N-DurHance ES Repair','AC-M68SV','Salipharm SA 25%','Tea Tree Oil / Helichrysum Oil','AQS-8']};let day='1',current=0;const el=id=>document.getElementById(id),inputs=Array.from(document.querySelectorAll('.digit'));const key=()=>`bronson_passport_safe_demo_claimed_day_${day}`;const getClaimed=()=>{try{return Math.max(0,Math.min(MAX,Number(localStorage.getItem(key()))||0))}catch(e){return 0}};const saveClaimed=n=>{try{localStorage.setItem(key(),String(n))}catch(e){message('ไม่สามารถบันทึกจำนวนรางวัลได้ กรุณาตรวจสอบ Safari')}};const show=id=>{document.querySelectorAll('#frame>section').forEach(s=>s.classList.toggle('active',s.id===id))};let tid;function message(s){const t=el('toast');t.textContent=s;t.classList.add('show');clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('show'),3300)}function refresh(){DAY_NAMES[day].forEach((name,i)=>{const label=el('bird-name-'+i);const BREAKS={'AIM ex Peach':'AIM ex\nPeach','Natural Clays':'Natural\nClays','Skincharge CLR':'Skincharge\nCLR','Organic Alpine':'Organic\nAlpine','Silky Mica CS':'Silky Mica\nCS','DISTINCTIVE® MAC':'DISTINCTIVE®\nMAC','Balance Silver':'Balance\nSilver','Natural Wax Jelly':'Natural Wax\nJelly','N-DurHance ES Repair':'N-DurHance\nES Repair','Salipharm SA 25%':'Salipharm\nSA 25%','Tea Tree Oil / Helichrysum Oil':'Tea Tree Oil /\nHelichrysum Oil'};label.textContent=BREAKS[name]||name;label.className='dynamic-name'+(name.length>25?' very-long':name.length>16?' long':'');inputs[i].setAttribute('aria-label',name+' รหัส 1 หลัก')});const count=getClaimed(),filled=inputs.filter(e=>e.value).length;el('stock').textContent=`${MAX-count} / ${MAX}`;el('claimed').textContent=`${count} claimed today`;el('day-cover').textContent=`DAY ${day} · REWARDS REMAINING`;el('filled').textContent=`${filled} / 6`;inputs.forEach((input,i)=>{el('digit-visible-'+i).textContent=input.value||''});el('live-safe-label').textContent=`DAY ${day} · REWARDS LEFT`;el('live-safe-number').textContent=`${MAX-count} / ${MAX}`;el('live-safe-claimed').textContent=`${count} claimed today`;el('live-win-count').textContent=`DAY ${day} · REMAINING ${MAX-count} / ${MAX}`;el('unlock').disabled=count>=MAX;el('unlock').style.opacity=count>=MAX?'.40':'1'}function clear(){inputs.forEach(i=>i.value='');refresh()}el('start').onclick=()=>{show('page-safe');refresh()};el('home').onclick=()=>{show('page-cover');clear()};el('clear').onclick=()=>{clear();message('ล้างรหัสแล้ว')};el('day').onchange=e=>{day=e.target.value;clear();refresh();message(`กำลังเล่น DAY ${day}`)};const keys=el('keys');for(const v of ['1','2','3','4','5','6','7','8','9','ลบ','0','ถัดไป']){let btn=document.createElement('button');btn.type='button';btn.textContent=v;btn.onclick=()=>{if(v==='ลบ'){inputs[current].value='';el('key-value').textContent='–';refresh()}else if(v==='ถัดไป'){if(current<5){current++;renderKey()}else closeKey()}else{inputs[current].value=v;el('key-value').textContent=v;refresh();setTimeout(()=>{if(current<5){current++;renderKey()}else closeKey()},120)}};keys.append(btn)}function renderKey(){el('key-title').textContent=DAY_NAMES[day][current];el('key-value').textContent=inputs[current].value||'–'}function openKey(i){current=i;renderKey();el('modal').classList.add('open')}function closeKey(){el('modal').classList.remove('open')}inputs.forEach((inp,i)=>inp.addEventListener('click',()=>openKey(i)));el('key-close').onclick=closeKey;el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeKey()});el('unlock').onclick=()=>{if(getClaimed()>=MAX){message('รางวัลของวันนี้หมดแล้ว');return}if(inputs.some(i=>!i.value)){message('กรุณากรอกเลขให้ครบทั้ง 6 ตัว');return}if(inputs.map(i=>i.value).join('')!==PINS[day]){closeKey();el('wrong-code-popup').classList.add('open');return}saveClaimed(getClaimed()+1);el('win-stock').textContent=`DAY ${day} · REMAINING ${MAX-getClaimed()} / ${MAX}`;show('page-win');refresh()};el('return').onclick=()=>{closeKey();clear();show('page-cover')};function returnHomeAfterWrongCode(){el('wrong-code-popup').classList.remove('open');closeKey();clear();show('page-cover');refresh()}el('wrong-code-close').onclick=returnHomeAfterWrongCode;el('wrong-code-popup').addEventListener('click',e=>{if(e.target===el('wrong-code-popup'))returnHomeAfterWrongCode()});window.addEventListener('keydown',e=>{if(!el('modal').classList.contains('open'))return;if(/^\d$/.test(e.key)){inputs[current].value=e.key;refresh();if(current<5)current++;else closeKey();renderKey()}else if(e.key==='Escape')closeKey();else if(e.key==='Backspace'){inputs[current].value='';refresh();renderKey()}});refresh();})();
