(()=>{const MAX=20,PINS={'1':'274589','2':'638152','3':'915743'},NAMES=['SKINCHARGE CLR™','AURUMCARE','MIYOFELL','ALPHASHIELD','AIM-EX PEACH','SPD-WT1'];let day='1',current=0;const el=id=>document.getElementById(id),inputs=Array.from(document.querySelectorAll('.digit'));const key=()=>`bronson_passport_safe_demo_claimed_day_${day}`;const getClaimed=()=>{try{return Math.max(0,Math.min(MAX,Number(localStorage.getItem(key()))||0))}catch(e){return 0}};const saveClaimed=n=>{try{localStorage.setItem(key(),String(n))}catch(e){message('ไม่สามารถบันทึกจำนวนรางวัลได้ กรุณาตรวจสอบ Safari')}};const show=id=>{document.querySelectorAll('#frame>section').forEach(s=>s.classList.toggle('active',s.id===id))};let tid;function message(s){const t=el('toast');t.textContent=s;t.classList.add('show');clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('show'),3300)}function refresh(){const count=getClaimed(),filled=inputs.filter(e=>e.value).length;el('stock').textContent=`${MAX-count} / ${MAX}`;el('claimed').textContent=`${count} claimed today`;el('day-cover').textContent=`DAY ${day} · REWARDS REMAINING`;el('filled').textContent=`${filled} / 6`;el('live-safe-label').textContent=`DAY ${day} · REWARDS REMAINING`;el('live-safe-number').textContent=`${MAX-count} / ${MAX}`;el('live-safe-claimed').textContent=`${count} claimed today`;el('live-win-count').textContent=`DAY ${day} · REMAINING ${MAX-count} / ${MAX}`;el('unlock').disabled=count>=MAX;el('unlock').style.opacity=count>=MAX?'.40':'1'}function clear(){inputs.forEach(i=>i.value='');refresh()}el('start').onclick=()=>{show('page-safe');refresh()};el('home').onclick=()=>{show('page-cover');clear()};el('clear').onclick=()=>{clear();message('ล้างรหัสแล้ว')};el('day').onchange=e=>{day=e.target.value;clear();refresh();message(`กำลังเล่น DAY ${day}`)};const keys=el('keys');for(const v of ['1','2','3','4','5','6','7','8','9','ลบ','0','ถัดไป']){let btn=document.createElement('button');btn.type='button';btn.textContent=v;btn.onclick=()=>{if(v==='ลบ'){inputs[current].value='';el('key-value').textContent='–';refresh()}else if(v==='ถัดไป'){if(current<5){current++;renderKey()}else closeKey()}else{inputs[current].value=v;el('key-value').textContent=v;refresh();setTimeout(()=>{if(current<5){current++;renderKey()}else closeKey()},120)}};keys.append(btn)}function renderKey(){el('key-title').textContent=NAMES[current];el('key-value').textContent=inputs[current].value||'–'}function openKey(i){current=i;renderKey();el('modal').classList.add('open')}function closeKey(){el('modal').classList.remove('open')}inputs.forEach((inp,i)=>inp.addEventListener('click',()=>openKey(i)));el('key-close').onclick=closeKey;el('modal').addEventListener('click',e=>{if(e.target===el('modal'))closeKey()});el('unlock').onclick=()=>{if(getClaimed()>=MAX){message('รางวัลของวันนี้หมดแล้ว');return}if(inputs.some(i=>!i.value)){message('กรุณากรอกเลขให้ครบทั้ง 6 ตัว');return}if(inputs.map(i=>i.value).join('')!==PINS[day]){message('รหัสยังไม่ถูกต้อง กรุณาตรวจสอบเลขตามชื่อคาแรกเตอร์');return}saveClaimed(getClaimed()+1);el('win-stock').textContent=`DAY ${day} · REMAINING ${MAX-getClaimed()} / ${MAX}`;show('page-win');refresh()};el('return').onclick=()=>{closeKey();clear();show('page-cover')};window.addEventListener('keydown',e=>{if(!el('modal').classList.contains('open'))return;if(/^\d$/.test(e.key)){inputs[current].value=e.key;refresh();if(current<5)current++;else closeKey();renderKey()}else if(e.key==='Escape')closeKey();else if(e.key==='Backspace'){inputs[current].value='';refresh();renderKey()}});refresh();})();
